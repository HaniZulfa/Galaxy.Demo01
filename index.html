<div class="info-icon" id="infoBtn">
    <span>i</span>
</div>

<div class="info-overlay" id="infoOverlay">
    <div class="info-card">
        <h3>Galaksi Control</h3>
        <ul>
            <li><span>[F]</span> Fullscreen Mode</li>
            <li><span>[Space]</span> Play / Pause</li>
            <li><span>[N]</span> Next Track</li>
            <li><span>[P]</span> Previous Track</li>
            <li><span>[M]</span> Mute / Unmute</li>
            <li><span>[Cubit]</span> Zoom Out - In</li>
        </ul>
        <p>Klik dimana saja untuk menutup</p>
    </div>
</div>

<div class="music-container" id="musicBtn" onclick="handleMusicClick()" style="cursor: pointer;">
    <audio id="audioLagu"></audio>
    <div class="play-icon">
        <span id="playStatus" style="font-size: 12px;">▶</span>
    </div>
    <div class="music-text">
        <div id="trackTitle" style="font-size: 14px; font-weight: bold;"></div>
        <div style="font-size: 10px; opacity: 0.6;">Artist</div>
    </div>
</div>

    <div class="info">
        <h1></h1>
        <p></p>
    </div>
